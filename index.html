<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <div class="calculator">

            <ul id="logo">
                <li><em>jhn-n</em></li>
                <li><strong>ODIN-pingcalc</strong></li>
            </ul>
            <p id="display">0</p>
        <div class="rowButtons">
            <button id="b7">7</button>
            <button id="b8">8</button>
            <button id="b9">9</button>
            <button id="del">del</button>
            <button id="ac">ac</button>
        </div>
        <div class="rowButtons">
            <button id="b4">4</button>
            <button id="b5">5</button>
            <button id="b6">6</button>
            <button id="mul">x</button>
            <button id="div">÷</button>
        </div>
        <div class="rowButtons">
            <button id="b1">1</button>
            <button id="b2">2</button>
            <button id="b3">3</button>
            <button id="plu">+</button>
            <button id="sub">-</button>
        </div>
        <div class="rowButtons">
            <button id="b0">0</button>
            <button id="dp">.</button>
            <button id="pi">π</button>
            <button id="lan">ans</button>
            <button id="eq">=</button>
        </div>
    </div>
</body>

</html>
